<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF + Audio Playlist</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

.fullscreen {
  position: fixed;
  top: 0; 
  left: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
  flex-direction: column;
}

#gifContainer {
  width: 300px;     /* square size */
  height: 300px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border-radius: 20px;   /* optional: rounded corners */
  box-shadow: 0 0 25px rgba(255,255,255,0.3); /* glowing effect */
  background: black;
}
#gifContainer iframe,
#gifContainer img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: none;
}



    .overlay-text {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 1.5em;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="fullscreen">
    <!-- Default GIF/Embed -->
    <div id="gifContainer">
      <iframe width="360" height="342" 
              style="position:absolute;top:0;left:0;width:100%;height:100%;" 
              frameBorder="0" 
              src="https://imgflip.com/embed/a625ts">
      </iframe>
    </div>
    <p class="overlay-text">this is still in the works for now so enjoy some music. if it doesnt work (the music), click on the thing on the search bear that looks like 2 lines with 2 dots and select allow audio and video.</p>
  </div>

  <audio id="bgAudio" autoplay></audio>

  <script>
    const audio = document.getElementById("bgAudio");
    const gifContainer = document.getElementById("gifContainer");

    // 🎶 Playlist
    const playlist = [
      "untitled.mp3",
      "untitled 2.mp3",
      "untitled 3.mp3"
    ];

// 🖼️ Gifs for each track
const gifs = [
  `<iframe src="https://imgflip.com/embed/a625ts" 
           frameborder="0"></iframe>`,

  `<iframe src="https://imgflip.com/embed/a625ts" 
           frameborder="0"></iframe>`,

  `<img src="https://art.pixilart.com/084fb928ce22c92.png" 
        alt="youre having a bad time">`
];

    let currentTrack = 0;

    function playTrack(index) {
      audio.src = playlist[index];
      audio.play().catch(err => console.log("Autoplay blocked:", err));

      // Swap GIF when track changes
      gifContainer.innerHTML = gifs[index];
    }

    // Start first track
    window.addEventListener("load", () => {
      playTrack(currentTrack);
    });

    // When song ends, play next
    audio.addEventListener("ended", () => {
      currentTrack++;
      if (currentTrack < playlist.length) {
        playTrack(currentTrack);
      } else {
        currentTrack = 0; // loop back
        playTrack(currentTrack);
      }
    });
  </script>
</body>
</html>
