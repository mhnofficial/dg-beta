<canvas id="fireCanvas"></canvas>
<audio id="music" src="Doom Eternal OST - The Only Thing They Fear Is You (Mick Gordon) [Doom Eternal Theme].mp3" autoplay loop></audio>

<script>
const canvas = document.getElementById('fireCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Fire animation
const flames = [];
const flameCount = 150;
for(let i=0;i<flameCount;i++){
  flames.push({
    x: Math.random()*canvas.width,
    y: canvas.height + Math.random()*100,
    size: Math.random()*50+50,
    speed: Math.random()*1.5+0.5,
    alpha: Math.random()*0.5+0.3
  });
}

function drawFire(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let f of flames){
    const gradient = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.size);
    gradient.addColorStop(0, `rgba(255,255,255,${f.alpha})`);
    gradient.addColorStop(0.3, `rgba(255,200,0,${f.alpha})`);
    gradient.addColorStop(0.6, `rgba(255,0,0,${f.alpha})`);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.size,0,Math.PI*2);
    ctx.fill();
    f.y -= f.speed;
    f.x += Math.sin(f.y*0.05)*1.5;
    f.size *= 0.98;
    if(f.size<10){
      f.x=Math.random()*canvas.width;
      f.y=canvas.height+50;
      f.size=Math.random()*50+50;
      f.speed=Math.random()*1.5+0.5;
      f.alpha=Math.random()*0.5+0.3;
    }
  }
  requestAnimationFrame(drawFire);
}
drawFire();

// Audio horizontal stretch
const audio = document.getElementById('music');
const main = document.querySelector('main');

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
const source = audioCtx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(audioCtx.destination);
analyser.fftSize = 256;
const dataArray = new Uint8Array(analyser.frequencyBinCount);

function animateStretch(){
  requestAnimationFrame(animateStretch);
  analyser.getByteFrequencyData(dataArray);

  let sum = 0;
  for(let i=0;i<dataArray.length;i++) sum += dataArray[i];
  let avg = sum / dataArray.length;

  const stretchX = 1 + (avg / 256);       // horizontal stretch
  const bounceY  = 0.9 + (avg / 512);    // small vertical bounce
  main.style.transform = `scaleX(${stretchX}) scaleY(${bounceY})`;
}
animateStretch();

// Resize canvas
window.addEventListener('resize', ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
