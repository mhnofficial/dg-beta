<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Menu</title>
  <style>

    html, body {
  background: rgb(16, 16, 16);
  margin: 0;
  padding: 0;
  height: 100%;
}
    body {
      margin: 0;
      padding: 0;
      background: #161616;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
    }

.header-img {
  width: 300px;   /* slightly bigger */
  height: auto;   /* keep proportions */
  display: block;
  margin: 20px auto; /* centers and adds spacing */
}

.menu {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 40px;
}

.menu a {
  display: inline-block;
  width: 380px;
  height: 380px;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.menu a img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.menu a:hover {
  transform: scale(1.04) translateY(-3px); /* subtle pop */
  animation: bounce 0.25s;
}

@keyframes bounce {
  0%, 100% { transform: scale(1.04) translateY(-3px); }
  50% { transform: scale(1.06) translateY(-5px); }
}

  </style>
</head>
<body>
  <!-- Your photo at the top -->
  <img src="2025_10_01_0x0_Kleki.png" class="header-img">

  <!-- 3 big image buttons -->
  <div class="menu">
    <a href="home.html"><img src="2025_10_01_0x6_Kleki.png" alt="Drawings"></a>
    <a href="home copy.html"><img src="2025_10_01_0x7_Kleki.png" alt="Games"></a>
    <a href="tung.html"><img src="2025_10_01_0x9_Kleki.png" alt="Movies"></a>
  </div>
</body>
</html>
