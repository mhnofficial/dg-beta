<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dollar General</title>
<link rel="icon" href="mobile logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #000;
    font-family: 'Poppins', sans-serif;
    color: #fff;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 20px;
    text-align: center;
    color: #fff;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 25px;
    width: 100%;
  }

  .game-card {
    background: #111;
    border-radius: 12px;
    border: 1px solid #222;
    text-align: center;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform 0.2s ease;
  }

  .game-card:hover {
    transform: translateY(-4px);
  }

  .game-card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
  }

  .game-card h3 {
    margin: 12px 0 6px;
    font-size: 1.2rem;
    font-weight: 600;
    color: #fff;
  }

  .game-card p {
    margin: 0 10px 12px;
    font-size: 0.95rem;
    color: #aaa;
    line-height: 1.4;
  }


  @media (max-width: 600px) {
    main {
      padding: 0 10px;
    }

    .game-card img {
      height: 100px;
    }
  }
</style>
</head>
<body>

<div class="sidebar">
  <a href="home.html"><i class="fas fa-home"></i><span>Home</span></a>
  <a href="stuff.html"><i class="fas fa-gamepad"></i><span>Stuff</span></a>
  <a href="#"><i class="fas fa-user"></i><span>Profile</span></a>
  <a href="#"><i class="fas fa-cog"></i><span>Settings</span></a>
</div>

<main>
  <h1>🎮 My Games</h1>
  <div class="game-grid">
    <a href="games html/game1.html" class="game-card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqg7RIriJMSplboDbyhdi9S2viLOtkdMk4Aw&s" alt="1v1.lol">
      <h3>1v1.lol</h3>
      <p>Fortnite for the school computers.</p>
    </a>
    <a href="games html/game2.html" class="game-card">
      <img src="https://via.placeholder.com/200x120.png?text=Game+2" alt="Game 2">
      <h3>Game 2</h3>
      <p>Puzzle adventure challenge.</p>
    </a>
    <a href="cop.html" target="_blank" class="game-card">
      <img src="https://via.placeholder.com/200x120.png?text=Game+3" alt="Game 3">
      <h3>WIP</h3>
      <p>not ready</p>
    </a>
  </div>
</main>

</body>
</html>
