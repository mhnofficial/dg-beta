<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>osu!-style Main Menu</title>

<style>
  :root{
    --bg-filter: blur(6px) brightness(.45);
    --accent: #ff66cc;
    --accent-2: #61d0ff;
    --glass: rgba(255,255,255,0.06);
    --glass-2: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.08);
    --shadow: 0 6px 30px rgba(0,0,0,0.6);
    --ease: cubic-bezier(.2,.9,.2,1);
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }

  html,body{
    height:100%;
    margin:0;
    font-family:var(--font-sans);
    color: #fff;
    background: #000;
    overflow:hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    background-image: url('your-bg.jpg'); /* replace */
    background-size: cover;
    background-position: center;
    transform: scale(1.05);
    filter: var(--bg-filter);
    z-index: 0;
  }

  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.6));
    mix-blend-mode: multiply;
  }

  .wrap{
    position:relative;
    z-index: 10;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px;
    box-sizing:border-box;
  }

  .menu {
    width: min(980px, 94vw);
    display:grid;
    grid-template-columns: 1fr 360px;
    gap: 26px;
    align-items:stretch;
    transition: transform 0.1s ease-out; /* bounce target */
  }

  .panel {
    background: linear-gradient(180deg, var(--glass), var(--glass-2));
    border-radius: 14px;
    padding: 18px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow);
    overflow:hidden;
    position:relative;
    min-height: 360px;
  }

  .logo {
    display:flex;
    gap:12px;
    align-items:center;
  }
  .logo .title {
    font-size:28px;
    font-weight:700;
    letter-spacing: -0.02em;
  }
  .logo small {
    opacity:0.8;
    display:block;
    font-weight:600;
    color:#eaeaea;
  }

  .preview {
    margin-top:16px;
    height: 220px;
    border-radius: 8px;
    overflow:hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.12));
    display:flex;
    align-items:center;
    justify-content:center;
    color: #ddd;
    font-size: 14px;
    position:relative;
  }

  .preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    transform: scale(1.06);
    filter: saturate(1.1) contrast(1.05);
  }
  .parallax {
    transform-origin:center;
    transition: transform 420ms var(--ease);
  }

  .buttons {
    background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.4));
    border-radius: 14px;
    padding: 12px;
    border:1px solid rgba(255,255,255,0.04);
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height: 300px;
  }

  .menu-item {
    --scale: 1;
    display:flex;
    align-items:center;
    gap:12px;
    padding: 12px 14px;
    border-radius:10px;
    cursor: pointer;
    user-select:none;
    transform: scale(var(--scale));
    transition: transform 180ms var(--ease), background 180ms var(--ease), box-shadow 180ms var(--ease);
    background: transparent;
    outline: none;
    border:1px solid transparent;
  }

  .menu-item .label {
    font-size:16px;
    font-weight:600;
    flex:1;
  }
  .menu-item .desc {
    font-size:12px;
    opacity:0.7;
  }

  .menu-item:hover,
  .menu-item:focus,
  .menu-item.selected {
    --scale: 1.02;
    background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
    box-shadow: 0 8px 26px rgba(0,0,0,0.6);
    border-color: rgba(255,255,255,0.05);
  }

  .menu-item .accent {
    width:6px;
    height:40px;
    border-radius:6px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    opacity:0;
    transform: translateX(-6px);
    transition: opacity 220ms, transform 220ms var(--ease);
  }
  .menu-item.selected .accent,
  .menu-item:focus .accent,
  .menu-item:hover .accent{
    opacity:1;
    transform: translateX(0);
  }

  .meta {
    margin-top:12px;
    font-size:12px;
    opacity:0.8;
    display:flex;
    justify-content:space-between;
  }

  @media (max-width:900px){
    .menu {
      grid-template-columns: 1fr;
    }
    .buttons {
      order:2;
    }
  }
</style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="wrap" role="main">
    <section class="menu bouncy" id="menuRoot">
      <div class="panel" id="left-panel">
        <div class="logo">
          <div>
            <div class="title">osu! — Custom Menu</div>
            <small id="current-mode">Standard • 4,237 online</small>
          </div>
        </div>

        <div class="preview" id="preview">
          <img id="previewImg" class="parallax" src="https://assets.codepen.io/605876/beatmap-preview.jpg" alt="Preview artwork">
        </div>

        <div class="meta">
          <div>Version 1.0</div>
          <div id="current-time"></div>
        </div>
      </div>

      <nav class="buttons" id="menuList">
        <div class="menu-item" tabindex="0" data-link="stuff.html" data-preview="https://assets.codepen.io/605876/preview-1.jpg" data-mode="Play">
          <div class="accent"></div>
          <div>
            <div class="label">Play</div>
            <div class="desc">This is the stuff</div>
          </div>
        </div>
        </div>
      </nav>
    </section>
  </main>

  <!-- Background music -->
  <audio id="bgm" src="untitled.mp3" autoplay loop></audio>

<script>
(function(){
  const items = Array.from(document.querySelectorAll('.menu-item'));
  const previewImg = document.getElementById('previewImg');
  const currentMode = document.getElementById('current-mode');
  const timeEl = document.getElementById('current-time');
  const menuRoot = document.getElementById('menuRoot');

  let selectedIndex = 0;

  function setTimeNow(){
    const d = new Date();
    timeEl.textContent = d.toLocaleTimeString();
  }
  setTimeNow();
  setInterval(setTimeNow, 1000);

  function select(index, options = {focus:true}){
    if(index < 0) index = 0;
    if(index >= items.length) index = items.length - 1;
    selectedIndex = index;

    items.forEach((it, i) => {
      it.classList.toggle('selected', i === index);
      if(i === index && options.focus) it.focus();
    });

    const chosen = items[index];
    const prev = chosen.dataset.preview;
    const mode = chosen.dataset.mode || '';
    if(prev) previewImg.src = prev;
    if(mode) currentMode.textContent = mode + ' • 4,237 online';
  }

  select(0, {focus:false});

  items.forEach((it, i) => {
    it.addEventListener('click', () => {
      // redirect to link
      const link = it.dataset.link;
      if(link) window.location.href = link;
    });

    it.addEventListener('mouseover', () => select(i, {focus:false}));
    it.addEventListener('focus', () => select(i, {focus:false}));
  });

  window.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowDown' || e.key === 's'){
      e.preventDefault();
      select((selectedIndex + 1) % items.length);
    } else if(e.key === 'ArrowUp' || e.key === 'w'){
      e.preventDefault();
      select((selectedIndex - 1 + items.length) % items.length);
    } else if(e.key === 'Enter'){
      e.preventDefault();
      items[selectedIndex].click();
    }
  });

  const previewContainer = document.getElementById('preview');
  previewContainer.addEventListener('mousemove', (ev) => {
    const r = previewContainer.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    const dx = (ev.clientX - cx) / r.width;
    const dy = (ev.clientY - cy) / r.height;
    previewImg.style.transform = `translate(${dx * 10}px, ${dy * 10}px) scale(1.06)`;
  });
  previewContainer.addEventListener('mouseleave', () => {
    previewImg.style.transform = `translate(0,0) scale(1.06)`;
  });

  // === BGM Bounce Effect ===
  const audio = document.getElementById('bgm');
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const src = ctx.createMediaElementSource(audio);
  const analyser = ctx.createAnalyser();
  src.connect(analyser);
  analyser.connect(ctx.destination);
  analyser.fftSize = 256;
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);

  function animate(){
    requestAnimationFrame(animate);
    analyser.getByteFrequencyData(dataArray);
    let bass = 0;
    for(let i=0;i<bufferLength/4;i++){ bass += dataArray[i]; }
    bass = bass/(bufferLength/4);

    let scale = 1 + (bass/255)*0.15;
    menuRoot.style.transform = `scale(${scale})`;
  }

  document.body.addEventListener('click',()=>{
    if(ctx.state==="suspended") ctx.resume();
  });

  animate();
})();
</script>
</body>
</html>
